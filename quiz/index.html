h1{font-size:40px}h2{font-size:28px}
.lead{color:var(--text2)}

.btn.big{width:100%;font-size:18px;margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--bg2);color:var(--text);border-radius:20px;padding:7px 13px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--yel);border-color:var(--yel);color:#111;font-weight:700}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit}
.meta{color:var(--text2);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--text2);margin-bottom:6px}
.bar{height:8px;background:var(--bg2);border-radius:8px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--gold);width:100%;transition:width .2s linear}
.qtext{font-size:22px;font-weight:700;margin:6px 0 4px}
.qsub{color:var(--text2);margin-bottom:10px;font-style:italic}
.flag{font-size:110px;text-align:center;line-height:1.1}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:13px 15px;font:inherit;font-weight:600;cursor:pointer;min-height:54px}

.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:12px;font-weight:600}
.score{font-family:'Cormorant',serif;font-size:64px;color:var(--gold);line-height:1;margin:6px 0}
.grid{font-size:21px;letter-spacing:1px;margin:6px 0;white-space:nowrap}
.banner{background:var(--yel);color:#111;border-radius:14px;padding:12px 14px;font-weight:700;margin:10px 0}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.hidden{display:none}
.streak{color:var(--gold);font-weight:700}
footer{max-width:680px;margin:0 auto;padding:0 16px 40px;color:var(--text2);font-size:14px}

  var duel = P.get('d') ? { seed: +P.get('d'), cat: P.get('c') || 'mix', s: +P.get('s') || 0, k: +P.get('k') || 0, name: (P.get('n') || '').slice(0, 20) || 'A friend' } : null;
  var dayN = Math.floor((Date.now() - Date.UTC(2026, 10, 9)) / 864e5) + 1, daySeed = +(new Date().toISOString().slice(0, 10).replace(/-/g, ''));
  function setLang(l) { lang = l; t = T[l]; LS.set('lang', l); try { DN = new Intl.DisplayNames([l], { type: 'region' }); } catch (e) {} document.documentElement.lang = l; paintLangs(); home(); }
  function paintLangs() { document.querySelectorAll('.langs button').forEach(function (b) { b.classList.toggle('on', b.dataset.l === lang); }); document.getElementById('ft').textContent = t.ft; var g = document.getElementById('ftg'); g.textContent = t.allGuides; g.href = BASE + (lang === 'de' ? 'de' : 'en') + '/guide/'; }
  document.querySelectorAll('.langs button').forEach(function (b) { b.onclick = function () { setLang(b.dataset.l); }; });
  function fmt(n) { try { return n.toLocaleString(lang); } catch (e) { return String(n); } }
  function catChips() { return '<div class="chips">' + Object.keys(t.cats).map(function (k) { return '<button class="chip' + (S.cat === k ? ' on' : '') + '" data-c="' + k + '">' + h(t.cats[k]) + '</button>'; }).join('') + '</div>'; }
  function bindChips() { app.querySelectorAll('.chip[data-c]').forEach(function (b) { b.onclick = function () { S.cat = b.dataset.c; LS.set('cat', S.cat); app.querySelectorAll('.chip[data-c]').forEach(function (x) { x.classList.toggle('on', x === b); }); }; }); }
  function home() {
    var best = LS.get('best', 0), games = LS.get('games', 0);
    var html = '<h1>🧭 ' + h(t.title) + '</h1><p class="lead">' + h(f(t.lead, { n: fmt(D.n) })) + '</p>';
    if (duel) html += '<div class="banner">⚔️ ' + h(f(t.challenged, { name: duel.name, s: fmt(duel.s), k: duel.k })) + '</div><button class="btn big" id="acc">' + h(t.accept) + '</button>';
    html += '<div class="card"><label class="meta" for="nm">' + h(t.name) + '</label><input type="text" id="nm" maxlength="20" value="' + h(S.name) + '" placeholder="Noel"><p class="meta" style="margin:10px 0 0">' + h(t.cat) + '</p>' + catChips()
      + '<button class="btn big" id="solo">▶️ ' + h(t.solo) + '</button><div class="row"><button class="btn alt" id="daily">📅 ' + h(t.daily) + ' #' + dayN + '</button><button class="btn alt" id="party">🎉 ' + h(t.party) + '</button></div>'
      + (games ? '<p class="meta">' + h(t.best) + ': ' + fmt(best) + ' ' + h(t.pts) + ' · ' + games + ' ' + h(t.games) + '</p>' : '') + '</div>';
    app.innerHTML = html; bindChips();
    var nm = document.getElementById('nm'); nm.oninput = function () { S.name = nm.value.trim(); LS.set('name', S.name); };
    document.getElementById('solo').onclick = function () { S.mode = 'solo'; play([{ n: S.name || t.you }], Math.floor(Math.random() * 2e9), S.cat); };
    document.getElementById('daily').onclick = function () { if (LS.get('day', 0) === daySeed) { alertBox(t.dailyDone); return; } S.mode = 'daily'; play([{ n: S.name || t.you }], daySeed, 'mix'); };
    document.getElementById('party').onclick = partySetup;
    if (duel) document.getElementById('acc').onclick = function () { S.mode = 'duel'; play([{ n: S.name || t.you }], duel.seed, duel.cat); };
  }
  function alertBox(msg) { var d = document.createElement('div'); d.className = 'banner'; d.textContent = msg; app.prepend(d); }
  function partySetup() {
    var ps = S.players.length ? S.players : [S.name || 'Player 1', 'Player 2'];
    function paint() {
      app.innerHTML = '<h2>🎉 ' + h(t.party) + '</h2><div class="card"><p class="meta">' + h(t.players) + '</p>' + ps.map(function (p, i) { return '<input type="text" maxlength="20" data-i="' + i + '" value="' + h(p) + '" style="margin:5px 0">'; }).join('')
        + (ps.length < 6 ? '<button class="btn alt" id="add" style="margin-top:6px">＋ ' + h(t.addP) + '</button>' : '') + '<p class="meta" style="margin-top:12px">' + h(t.cat) + '</p>' + catChips() + '<button class="btn big" id="go">▶️ ' + h(t.start) + '</button><button class="btn alt big" id="bk">' + h(t.home) + '</button></div>';
      bindChips();
      app.querySelectorAll('input[data-i]').forEach(function (inp) { inp.oninput = function () { ps[+inp.dataset.i] = inp.value; }; });
      var a = document.getElementById('add'); if (a) a.onclick = function () { ps.push('Player ' + (ps.length + 1)); paint(); };
      document.getElementById('bk').onclick = home;
      document.getElementById('go').onclick = function () { S.players = ps.map(function (p, i) { return (p || '').trim() || 'Player ' + (i + 1); }); S.mode = 'party'; var base = Math.floor(Math.random() * 2e9); play(S.players.map(function (n, i) { return { n: n, seed: base + i * 7919 }; }), base, S.cat); };
    }
    paint();
  }
  // --- Spiel ---
  var timer = null;
  function play(players, seed, cat) {
    var pi = 0;
    players.forEach(function (p) { p.score = 0; p.k = 0; p.grid = ''; p.streak = 0; });
    function nextPlayer() {
      if (pi >= players.length) return finish(players, seed, cat);
      var p = players[pi], qs = round(p.seed || seed, cat), qi = 0;
      if (players.length > 1) { app.innerHTML = '<div class="card" style="text-align:center"><h2>' + h(f(t.turn, { name: p.n })) + '</h2><button class="btn big" id="rd">' + h(t.ready) + '</button></div>'; document.getElementById('rd').onclick = ask; } else ask();
      function ask() {
        if (qi >= qs.length) { pi++; return nextPlayer(); }
        var q = qs[qi], left = 15, t0 = Date.now(), done = false;
        app.innerHTML = '<div class="top"><span>' + h(t.q) + ' ' + (qi + 1) + '/10' + (players.length > 1 ? ' · ' + h(p.n) : '') + '</span><span>' + fmt(p.score) + ' ' + h(t.pts) + (p.streak > 1 ? ' · <span class="streak">🔥 ' + p.streak + '</span>' : '') + '</span></div><div class="bar"><i id="tb"></i></div>'
          + (q.extra && q.extra.flag ? '<div class="flag">' + q.extra.flag + '</div>' : '') + '<div class="qtext">' + h(q.text) + '</div>' + (q.sub ? '<div class="qsub">' + h(q.sub) + '</div>' : '')
          + '<div class="opts">' + q.opts.map(function (o, i) { return '<button class="opt" data-i="' + i + '">' + h(o) + '</button>'; }).join('') + '</div><div class="fb" id="fb"></div>';
        var tb = document.getElementById('tb');
        clearInterval(timer); timer = setInterval(function () { var el = (Date.now() - t0) / 1000; tb.style.width = Math.max(0, 100 - el / left * 100) + '%'; if (el >= left) answer(-1); }, 100);
        app.querySelectorAll('.opt').forEach(function (b) { b.onclick = function () { answer(+b.dataset.i); }; });
        function answer(i) {
          if (done) return; done = true; clearInterval(timer);
          var el = (Date.now() - t0) / 1000, ok = i === q.a;
          app.querySelectorAll('.opt').forEach(function (b, j) { b.disabled = true; if (j === q.a) b.classList.add('ok'); else if (j === i) b.classList.add('bad'); });
          if (ok) { p.k++; p.streak++; p.score += 100 + Math.round(50 * Math.max(0, left - el) / left) + (p.streak >= 3 ? 20 : 0); p.grid += '🟩'; } else { p.streak = 0; p.grid += '🟥'; }
          var fb = ok ? '✅ ' + t.correct : (i < 0 ? '⏱️ ' + t.timeup : '❌ ' + t.wrong) + ' ' + q.opts[q.a] + '.';
          var cta = q.extra && q.extra.guide ? ' <a href="' + BASE + q.extra.guide + '" target="_blank" rel="noopener">' + h(f(t.guideCta, { city: q.extra.city })) + '</a>' : '';
          document.getElementById('fb').innerHTML = h(fb) + cta + '<div style="margin-top:12px"><button class="btn big" id="nx">' + h(t.next) + ' →</button></div>';
          document.getElementById('nx').onclick = function () { qi++; ask(); };
        }
      }
    }
    nextPlayer();
  }
  function finish(players, seed, cat) {
    var p = players[0], html = '';
    LS.set('games', LS.get('games', 0) + players.length);
    if (S.mode === 'party') {
      var sorted = players.slice().sort(function (a, b) { return b.score - a.score; });
      html = '<h2>🏆 ' + h(t.board) + '</h2><div class="card"><table>' + sorted.map(function (x, i) { return '<tr><td>' + (['🥇', '🥈', '🥉'][i] || (i + 1) + '.') + '</td><td><b>' + h(x.n) + '</b><br><span class="meta">' + x.grid + '</span></td><td style="text-align:right">' + fmt(x.score) + '<br><span class="meta">' + x.k + '/10</span></td></tr>'; }).join('') + '</table></div>'
        + '<button class="btn big" id="again">🔁 ' + h(t.again) + '</button><button class="btn alt big" id="hm">' + h(t.home) + '</button>';
      app.innerHTML = html;
      document.getElementById('again').onclick = function () { var base = Math.floor(Math.random() * 2e9); play(S.players.map(function (n, i) { return { n: n, seed: base + i * 7919 }; }), base, cat); };
      document.getElementById('hm').onclick = home; return;
    }
    if (p.score > LS.get('best', 0)) LS.set('best', p.score);
    if (S.mode === 'daily') LS.set('day', daySeed);
    var link = BASE + 'quiz/?d=' + seed + '&c=' + cat + '&s=' + p.score + '&k=' + p.k + '&n=' + encodeURIComponent(p.n) + '&l=' + lang;
    var text = S.mode === 'daily' ? f(t.dailyText, { d: dayN, k: p.k, g: p.grid, u: BASE + 'quiz/' }) : f(t.shareText, { s: fmt(p.score), k: p.k, g: p.grid, u: link });
    html = '<h2>' + h(t.result) + '</h2><div class="card" style="text-align:center"><div class="score">' + fmt(p.score) + '</div><div>' + p.k + '/10 · ' + h(t.pts) + '</div><div class="grid">' + p.grid + '</div>';
    if (S.mode === 'duel' && duel) { var res = p.score > duel.s ? t.win : p.score < duel.s ? f(t.lose, { name: duel.name }) : t.draw; html += '<div class="banner">' + h(t.you) + ' ' + fmt(p.score) + ' vs ' + h(duel.name) + ' ' + fmt(duel.s) + ' – ' + h(res) + '</div>'; }
    html += '</div><button class="btn big" id="sh">⚔️ ' + h(S.mode === 'duel' ? t.rematch : t.shareDuel) + '</button><div class="row"><a class="btn alt" id="wa" target="_blank" rel="noopener">💬 ' + h(t.wa) + '</a><button class="btn alt" id="cp">📋 ' + h(t.copy) + '</button></div>'
      + '<button class="btn big" id="again" style="margin-top:12px">🔁 ' + h(t.again) + '</button><button class="btn alt big" id="hm">' + h(t.home) + '</button>'
      + '<div class="card"><a href="' + BASE + (lang === 'de' ? 'de' : 'en') + '/guide/">🗺️ ' + h(t.allGuides) + ' →</a></div>';
    app.innerHTML = html;
    document.getElementById('wa').href = 'https://wa.me/?text=' + encodeURIComponent(text);
    document.getElementById('cp').onclick = function () { var b = this; try { navigator.clipboard.writeText(text).then(function () { b.textContent = t.copied; }); } catch (e) {} };
    document.getElementById('sh').onclick = function () {
      var u = S.mode === 'duel' ? BASE + 'quiz/?d=' + Math.floor(Math.random() * 2e9) + '&c=' + cat + '&l=' + lang : link;
      if (S.mode === 'duel') { duel = null; S.mode = 'solo'; history.replaceState(null, '', BASE + 'quiz/'); return play([{ n: p.n }], +new URL(u).searchParams.get('d'), cat); }
      if (navigator.share) navigator.share({ title: 'HiddenGem.Atlas Travel Quiz', text: text }).catch(function () {}); else { try { navigator.clipboard.writeText(text); } catch (e) {} this.textContent = t.copied; }
    };
    document.getElementById('again').onclick = function () { duel = null; S.mode = 'solo'; play([{ n: p.n }], Math.floor(Math.random() * 2e9), cat); };
    document.getElementById('hm').onclick = function () { duel = null; history.replaceState(null, '', BASE + 'quiz/'); home(); };
  }
  paintLangs();
  fetch('../data/quiz.json').then(function (r) { return r.json(); }).then(function (d) { D = d; prep(); home(); }).catch(function () { app.innerHTML = '<p>Quiz could not be loaded – please reload.</p>'; });
})();
</script>
