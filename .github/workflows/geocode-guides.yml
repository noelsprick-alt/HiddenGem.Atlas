name: Guide-Orte verorten (OpenStreetMap)
on:
  push:
    paths:
      - 'scripts/geocode-guides.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website-bot
  cancel-in-progress: false
jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/geocode-guides.mjs
      - run: |
          git config user.name "hiddengemat-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data-src/geocode-guides.json
          if ! git diff --staged --quiet; then
            git commit -m "Guide-Orte verortet (OpenStreetMap)"
            git pull --rebase --autostash || true
            git push
          fi
