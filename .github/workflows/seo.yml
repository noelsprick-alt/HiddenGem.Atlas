name: SEO-Seiten neu bauen
on:
  push:
    paths:
      - 'index.html'
      - 'data/moments-*.json'
      - 'data/routes.json'
      - 'data/content.json'
      - 'scripts/build-seo.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website-bot
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-seo.mjs
      - run: |
          git config user.name "hiddengemat-bot"
          git config user.email "bot@users.noreply.github.com"
          git add de en sitemap.xml robots.txt seo.css
          if ! git diff --staged --quiet; then
            git commit -m "SEO-Seiten aktualisiert"
            git pull --rebase --autostash || true
            git push
          fi
