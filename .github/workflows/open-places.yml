name: Offene Ortsdaten holen (Wikidata + Koordinaten-Check)
on:
  workflow_dispatch:
    inputs:
      what:
        description: 'wikidata | geocode | all'
        default: 'all'
        required: false
permissions:
  contents: write
concurrency:
  group: website-bot
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wikidata
        if: ${{ github.event.inputs.what != 'geocode' }}
        timeout-minutes: 110
        continue-on-error: true
        run: node scripts/fetch-open-places.mjs
      - name: Koordinaten prüfen (OpenStreetMap)
        if: ${{ always() && github.event.inputs.what != 'wikidata' }}
        timeout-minutes: 20
        continue-on-error: true
        run: node scripts/geocode-curated.mjs
      - if: ${{ always() }}
        run: |
          git config user.name "hiddengemat-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data-src
          if ! git diff --staged --quiet; then
            git commit -m "Offene Ortsdaten aktualisiert"
            git pull --rebase --autostash || true
            git push
          fi
