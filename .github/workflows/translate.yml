name: Inhalte übersetzen (DE → EN)
on:
  push:
    paths:
      - 'data/content.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website-bot
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/translate-content.mjs
      - run: |
          git config user.name "hiddengemat-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/content.json
          if ! git diff --staged --quiet; then
            git commit -m "Englische Übersetzung ergänzt"
            git pull --rebase --autostash || true
            git push
          fi
